name: Tests

on:
    push:
        branches: [master]
    pull_request:

jobs:
    calidad:
        runs-on: ubuntu-latest
        name: Estilo, analisis y cobertura

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo, pdo_sqlite, sqlite3, mbstring
                  coverage: pcov

            - run: composer update --prefer-dist --no-interaction --no-progress

            - name: Estilo de codigo
              run: vendor/bin/pint --test

            - name: Analisis estatico
              run: vendor/bin/phpstan analyse --no-progress

            - name: Cobertura
              run: vendor/bin/phpunit --coverage-clover=coverage.xml

            # El minimo esta por debajo del valor real a proposito: es una red
            # para que nadie meta un modulo entero sin probar, no una cifra que
            # haya que perseguir. Lo que no cubre esta ejecucion son las ramas
            # de MySQL y PostgreSQL, que cubren los jobs de abajo.
            - name: Minimo de cobertura
              run: |
                  php -r '
                      $x = simplexml_load_file("coverage.xml");
                      $m = $x->project->metrics;
                      $pct = 100 * (int) $m["coveredstatements"] / (int) $m["statements"];
                      printf("Cobertura de lineas: %.2f%%\n", $pct);
                      if ($pct < 88) {
                          fwrite(STDERR, "Por debajo del minimo del 88%\n");
                          exit(1);
                      }
                  '

    sqlite:
        runs-on: ubuntu-latest
        needs: calidad

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.2'
                      laravel: '^12.0'
                      testbench: '^10.0'
                    - php: '8.3'
                      laravel: '^12.0'
                      testbench: '^10.0'
                    - php: '8.3'
                      laravel: '^13.0'
                      testbench: '^11.0'
                    - php: '8.4'
                      laravel: '^13.0'
                      testbench: '^11.0'

        name: SQLite · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo, pdo_sqlite, sqlite3, mbstring
                  coverage: none

            - name: Instalar dependencias
              run: |
                  composer require --no-update --dev \
                      "laravel/framework:${{ matrix.laravel }}" \
                      "orchestra/testbench:${{ matrix.testbench }}"
                  composer update --prefer-dist --no-interaction --no-progress

            - name: Tests
              run: vendor/bin/phpunit --no-coverage

    # El paquete adapta el SQL a cada motor: ILIKE en PostgreSQL, FIELD() en
    # MySQL, tres sintaxis de EXPLAIN y una deteccion de texto completo distinta.
    # Probar eso solo sobre SQLite es no probarlo: de hecho, correr la suite
    # sobre MySQL destapo dos fallos del analizador que llevaban ahi desde el
    # primer dia.
    motores:
        runs-on: ubuntu-latest
        needs: calidad
        name: ${{ matrix.driver }}

        strategy:
            fail-fast: false
            matrix:
                driver: [mysql, pgsql]

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_DATABASE: surge_test
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: secreto
                    POSTGRES_DB: surge_test
                ports: ['5432:5432']
                options: >-
                    --health-cmd=pg_isready
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo, pdo_mysql, pdo_pgsql, mbstring
                  coverage: none

            - run: composer update --prefer-dist --no-interaction --no-progress

            - name: Tests sobre ${{ matrix.driver }}
              env:
                  DB_CONNECTION: ${{ matrix.driver }}
                  DB_DATABASE: surge_test
                  DB_HOST: 127.0.0.1
                  DB_PORT: ${{ matrix.driver == 'mysql' && '3306' || '5432' }}
                  DB_USERNAME: ${{ matrix.driver == 'mysql' && 'root' || 'postgres' }}
                  DB_PASSWORD: ${{ matrix.driver == 'mysql' && '' || 'secreto' }}
              run: vendor/bin/phpunit --no-coverage
